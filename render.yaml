services:
  - type: web
    name: web-companion-api
    runtime: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PGSSL
        value: require
